<!--
  ══════════════════════════════════════════════════════════════════════
  Coffee Geeks Panamá — Hosted Payment Page (PowerTranz / BAC)
  Contenido para el editor Advanced del Portal del Comercio.

  LO QUE SE APRENDIÓ AL PUBLICARLA
  1. El PageSet lleva el prefijo obligatorio "Ptz/": va como
     "Ptz/CoffeeGeeks". Sin él, el Conductor responde 757.
  2. **El editor elimina los atributos style en línea.** Por eso todo el
     diseño vive en Custom Styles y el HTML solo lleva clases.
  3. Los campos que genera PowerTranz traen sus propias clases e id
     (.text-field, .submit-btn, #CardNo, #Amount, #invalid), que son los
     ganchos que usa la hoja de estilo.
  4. Su script oculta #invalid al cargar y lo muestra con display:block
     cuando hay error, así que no hay que forzarlo desde CSS.

  Los nueve tokens @...@ del formulario son obligatorios: el portal
  rechaza el guardado si falta alguno.

  AJUSTE PEDIDO POR FAC EL 11 DE SEPTIEMBRE DE 2026
  El correo electrónico es obligatorio para las marcas y la plantilla
  anterior no lo enviaba. Por eso la página debe crearse con la plantilla
  que incluye correo, y el campo debe quedar marcado como obligatorio con
  su validación activa en el Portal del Comercio.

  OJO CON EL NOMBRE DEL TOKEN: abajo va como @Email@, que es lo que
  corresponde al resto de la nomenclatura, pero **hay que confirmarlo en la
  lista de tokens que muestra el editor del Portal** antes de guardar. Si
  el portal lo llama de otro modo, se cambia ahí y nada más: el estilo
  cuelga del atributo type, no del nombre.
  ══════════════════════════════════════════════════════════════════════
-->

<!-- ─────────────── CAMPO "HTML" ─────────────── -->

<div class="cg-cab">
  <img class="cg-logo" src="https://coffeegeekspanama.com/logo-vino.png" alt="Coffee Geeks Panamá">
  <span class="cg-eyebrow">Pago seguro</span>
</div>

<div class="cg-caja">
  <h1>Datos de tu tarjeta</h1>

  @FormStart@
    @Invalid@
    <label>Nombre del tarjetahabiente</label>
    @CardHolderName@
    <label>Correo electrónico <span class="cg-nota">para el comprobante de tu pago</span></label>
    @Email@
    <label>Número de tarjeta</label>
    @CardNo@
    <div class="cg-fila">
      <div class="cg-col">
        <label>Vence <span class="cg-nota">mes y año, sin barra — ej. 1229</span></label>
        @CardExpDate@
      </div>
      <div class="cg-col">
        <label>CVV</label>
        @CardCVV2@
      </div>
    </div>
    <div class="cg-total">
      <span class="cg-total-lbl">Total</span>
      @Amount@
    </div>
    @Submit@
  @FormEnd@

  <div class="cg-pie">
    Tus datos viajan cifrados y son procesados por BAC Credomatic.<br>
    Coffee Geeks Panamá no almacena información de tu tarjeta.
  </div>
</div>

<!-- ─────────────── CAMPO "CUSTOM STYLES" ───────────────

@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;500;700&display=swap');

body{background:#f4efe4;color:#38050e;font-family:'Barlow',system-ui,sans-serif;font-size:15px;margin:0;padding:24px 16px}

.cg-cab{text-align:center;padding:4px 0 20px}
/* El archivo mide 577x287: sin tope se dibuja a tamano natural y tapa el
   formulario en pantallas angostas. Va acotado por alto y por ancho, y por
   selector de elemento ademas de por clase, para que no dependa de que el
   editor del Portal conserve la clase. */
img{max-width:100%;height:auto}
.cg-cab img,.cg-logo{display:inline-block;width:auto;height:auto;max-height:50px;max-width:62%}
.cg-eyebrow{display:block;margin-top:10px;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;opacity:.55}

.cg-caja{max-width:460px;margin:0 auto}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:30px;text-transform:uppercase;line-height:1.05;margin:0 0 18px}

label{display:block;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;opacity:.65;margin-bottom:6px}
.cg-nota{letter-spacing:0;text-transform:none;opacity:.7}

input.text-field,input[type=text],input[type=email],select{width:100%;box-sizing:border-box;font-family:'Barlow',sans-serif;font-size:16px;color:#38050e;background:#fff;border:1px solid #cddbf2;border-radius:14px;padding:13px 15px;margin-bottom:16px}
input.text-field:focus,input[type=text]:focus,input[type=email]:focus{outline:none;border-color:#38050e;box-shadow:0 0 0 3px rgba(56,5,14,.10)}
#CardNo,#CardExpDate,#CardCVV2{font-variant-numeric:tabular-nums;letter-spacing:.06em}

.cg-fila{display:flex;gap:14px}
.cg-col{flex:1;min-width:0}

.cg-total{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:2px solid #38050e;padding-top:14px;margin-top:6px;margin-bottom:18px}
.cg-total-lbl{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;text-transform:uppercase}
.cg-total input{width:auto;text-align:right;border:none;background:transparent;margin:0;padding:0;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:26px;color:#38050e}

input.submit-btn,input[type=button],input[type=submit],button{display:block;width:100%;box-sizing:border-box;height:54px;background:#38050e;color:#fff;font-family:'Barlow',sans-serif;font-size:16px;font-weight:700;border:none;border-radius:50px;cursor:pointer;box-shadow:0 4px 14px rgba(56,5,14,.18);margin-bottom:0}
input.submit-btn:hover,input[type=button]:hover,button:hover{background:#24060c}

#invalid{color:#8a1220 !important;background:#fdecee;border:1px solid #f3c9ce;border-radius:12px;padding:12px 15px;margin-bottom:16px;font-size:14px;line-height:1.5}

.cg-pie{margin-top:22px;padding-top:18px;border-top:1px solid #cddbf2;font-size:12px;line-height:1.55;text-align:center;opacity:.6}

@media(max-width:420px){ .cg-fila{gap:10px} h1{font-size:26px} .cg-cab{padding-bottom:14px} .cg-cab img,.cg-logo{max-height:36px;max-width:56%} }

─────────────────────────────────────────────────────── -->
