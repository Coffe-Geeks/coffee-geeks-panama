<!--
  ══════════════════════════════════════════════════════════════════════
  Coffee Geeks Panamá — Hosted Payment Page (PowerTranz / BAC)
  Contenido para el editor Advanced del Portal del Comercio.

  El editor tiene dos campos. Este archivo trae el contenido de los dos,
  separados por su rótulo. Se pegan completos, reemplazando lo que haya.

  Los nueve tokens @...@ son obligatorios: el portal rechaza el guardado
  si falta alguno. No se pueden renombrar ni quitar.

  El logo va en su variante vino (logo-vino.png) porque el logo de marca
  es crema, para fondos oscuros, y la página de pago se sirve sobre crema.
  ══════════════════════════════════════════════════════════════════════
-->

<!-- ─────────────── CAMPO "HTML" ─────────────── -->

<div style="text-align:center;padding:4px 0 22px">
  <img src="https://pruebas-coffee-geeks.vercel.app/logo-vino.png" alt="Coffee Geeks Panamá" style="height:50px">
  <span style="display:block;margin-top:10px;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;opacity:.55">Pago seguro</span>
</div>

<div style="max-width:460px;margin:0 auto">
  <h1>Datos de tu tarjeta</h1>

  @FormStart@
    @Invalid@
    <label>Nombre del tarjetahabiente</label>
    @CardHolderName@
    <label>Número de tarjeta</label>
    @CardNo@
    <div style="display:flex;gap:14px">
      <div style="flex:1"><label>Vence</label>@CardExpDate@</div>
      <div style="flex:1"><label>CVV</label>@CardCVV2@</div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;padding:16px 0;margin-bottom:8px;border-top:2px solid #38050e;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;text-transform:uppercase">
      <span>Total</span> @Amount@
    </div>
    @Submit@
  @FormEnd@

  <div style="margin-top:22px;padding-top:18px;border-top:1px solid #cddbf2;font-size:12px;line-height:1.55;text-align:center;opacity:.6">
    Tus datos viajan cifrados y son procesados por BAC Credomatic.<br>
    Coffee Geeks Panamá no almacena información de tu tarjeta.
  </div>
</div>
