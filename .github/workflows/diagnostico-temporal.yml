# WORKFLOW TEMPORAL DE DIAGNÓSTICO
# Lista solo los NOMBRES de las variables del proyecto, para saber cuáles
# faltan. No imprime valores y no modifica nada. Se elimina al terminar.
name: Diagnóstico temporal

on:
  push:
    branches: [test]
  workflow_dispatch:

jobs:
  listar:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.DEPLOY_ORG }}
      VERCEL_PROJECT_ID: ${{ secrets.DEPLOY_PROJECT }}
    steps:
      - name: Variables configuradas en el proyecto
        run: |
          npm install -g vercel@latest > /dev/null 2>&1
          echo "── Variables del proyecto, solo nombres y entornos ──"
          vercel env ls --token="${{ secrets.DEPLOY_TOKEN }}" 2>&1 | sed 's/[A-Za-z0-9_-]\{24,\}/<oculto>/g'
