name: Publicar pruebas

# Cada push a la rama test publica el sitio de PRUEBAS, sin tocar
# coffeegeekspanama.com. La dirección de pruebas es siempre la misma y
# queda anotada en el resumen de cada corrida, en la pestaña Actions.
on:
  push:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: publicar-pruebas
  cancel-in-progress: true

jobs:
  comprobar:
    runs-on: ubuntu-latest
    outputs:
      hay_token: ${{ steps.token.outputs.hay }}
    steps:
      - id: token
        run: echo "hay=${{ secrets.DEPLOY_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  publicar:
    needs: comprobar
    if: needs.comprobar.outputs.hay_token == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.DEPLOY_ORG }}
      VERCEL_PROJECT_ID: ${{ secrets.DEPLOY_PROJECT }}

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Publicar
        id: publicar
        # Compilación remota: la máquina de turno solo manda el código.
        run: |
          npm install -g vercel@latest
          url=$(vercel deploy --yes --token="${{ secrets.DEPLOY_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Publicado en: $url"

      - name: Fijar la dirección de pruebas
        # La dirección fija apunta siempre a la última publicación, para no
        # andar persiguiendo el enlace de cada corrida. Se pide por la API y
        # no con `vercel alias`: ese comando necesita permisos de toda la
        # cuenta y aquí solo hay permiso sobre este proyecto.
        run: |
          destino="${{ steps.publicar.outputs.url }}"
          respuesta=$(curl -s -w '\n%{http_code}' -X POST \
            "https://api.vercel.com/v2/deployments/${destino#https://}/aliases?teamId=${{ secrets.DEPLOY_ORG }}" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"alias":"pruebas-coffee-geeks.vercel.app"}')
          codigo=$(echo "$respuesta" | tail -1)
          echo "$respuesta" | head -n -1
          [ "$codigo" = "200" ] || { echo "La API respondió $codigo"; exit 1; }

      - name: Comprobar que responde
        continue-on-error: true
        run: |
          for ruta in / /participantes /guia-de-experiencias /tienda /blogs; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://pruebas-coffee-geeks.vercel.app$ruta")
            echo "$ruta -> $code"
          done

      - name: Resumen
        run: |
          {
            echo "### Sitio de pruebas actualizado"
            echo ""
            echo "- Dirección fija: https://pruebas-coffee-geeks.vercel.app"
            echo "- Esta publicación: ${{ steps.publicar.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
