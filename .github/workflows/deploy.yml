name: Desplegar a producción

# Cada push a main compila el sitio y lo publica en producción
# (coffeegeekspanama.com), que vive en Vercel. También se puede lanzar a
# mano desde la pestaña Actions. Si se quiere exigir aprobación antes de
# publicar: Settings → Environments → production → Required reviewers.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Dos despliegues simultáneos se pisarían el uno al otro
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  comprobar:
    # El contexto `secrets` no se puede leer en el `if` de un job, así que
    # este paso lo convierte en un output normal. Sin VERCEL_TOKEN cargado,
    # el despliegue se salta (gris) en vez de fallar (rojo).
    runs-on: ubuntu-latest
    outputs:
      hay_token: ${{ steps.token.outputs.hay }}
    steps:
      - id: token
        run: echo "hay=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  desplegar:
    needs: comprobar
    if: needs.comprobar.outputs.hay_token == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Traer la configuración de producción de Vercel
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Compilar
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Publicar en producción
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Comprobar que el sitio responde
        # Informativo: el deploy ya se publicó en el paso anterior. Reintenta
        # unas veces por si el dominio tarda unos segundos en apuntar a la
        # nueva versión; nunca tumba el despliegue por un chequeo lento.
        continue-on-error: true
        run: |
          for ruta in / /participantes /guia-de-experiencias /tienda /blogs; do
            codigo=""
            for intento in 1 2 3 4 5; do
              codigo=$(curl -s -o /dev/null -w "%{http_code}" "https://coffeegeekspanama.com$ruta")
              [ "$codigo" = "200" ] && break
              sleep 5
            done
            echo "$ruta -> $codigo"
          done
